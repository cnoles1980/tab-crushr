<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Crushr</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brandBlock">
          <img class="brandIcon" src="../icons/icon-48.png" alt="">
          <div>
            <h1>Tab Crushr</h1>
            <p id="trackingStatus" class="status">Loading...</p>
          </div>
        </div>
        <button id="refreshButton" class="iconButton refreshIcon" title="Refresh scan" aria-label="Refresh scan">&#8635;</button>
      </header>

      <section class="crushProgress" aria-label="Crush progress">
        <span class="progressLabel">Crush progress</span>
        <div class="progressStats">
          <div>
            <strong id="lifetimeTabs">0</strong>
            <span>tabs crushed</span>
          </div>
          <div>
            <strong id="lifetimeRam">0 MB</strong>
            <span>estimated RAM reclaimed</span>
          </div>
        </div>
        <div id="nextMilestone" class="nextMilestone">
          <div class="milestoneHeading">
            <strong id="nextMilestoneName">First Crush</strong>
            <span id="nextMilestonePercent">0%</span>
          </div>
          <div class="progressTrack" aria-hidden="true">
            <span id="nextMilestoneBar"></span>
          </div>
          <span id="nextMilestoneRemaining" class="milestoneRemaining">1 tab to go</span>
        </div>
      </section>

      <section id="impactText" class="impact" hidden aria-live="polite">
        <strong id="impactTitle"></strong>
        <span id="impactDetails"></span>
        <span id="impactAchievement" class="impactAchievement" hidden></span>
      </section>

      <section class="settings" aria-label="Settings">
        <label class="toggle">
          <input id="includeIncognito" type="checkbox">
          <span>Incognito</span>
        </label>
        <label class="toggle">
          <input id="discardInsteadOfClose" type="checkbox">
          <span>Discard mode</span>
        </label>
        <label class="toggle">
          <input id="protectPinnedAudibleActive" type="checkbox">
          <span>Protect active media</span>
        </label>
      </section>

      <section id="notice" class="notice" hidden></section>

      <section class="summary" aria-label="Summary">
        <div>
          <strong id="candidateCount">0</strong>
          <span>matches</span>
        </div>
        <div>
          <strong id="tabCount">0</strong>
          <span>tabs scanned</span>
        </div>
        <div>
          <strong id="selectedPercent">0%</strong>
          <span>selected to crush</span>
        </div>
        <div>
          <strong id="ramSavings">0 MB</strong>
          <span>est. RAM saved</span>
        </div>
      </section>

      <details class="achievements">
        <summary>All milestones</summary>
        <div id="achievementList" class="achievementList"></div>
      </details>

      <details class="earnedAchievements">
        <summary>Earned achievements</summary>
        <div id="earnedAchievementList" class="earnedAchievementList"></div>
      </details>

      <section class="viewTabs" aria-label="Tab views">
        <button id="duplicateViewButton" class="viewTab active" type="button" data-view="duplicates" aria-pressed="true">Duplicate Tabs</button>
        <button id="oldViewButton" class="viewTab" type="button" data-view="old" aria-pressed="false">Old Tabs</button>
        <button id="allViewButton" class="viewTab" type="button" data-view="all" aria-pressed="false">All Tabs</button>
      </section>

      <section id="candidateList" class="candidateList" aria-live="polite"></section>

      <footer class="actions">
        <button id="keepButton" class="secondary" type="button">Keep</button>
        <button id="saveButton" class="secondary" type="button">Save for Later</button>
        <button id="crushButton" class="primary" type="button">Crush Tabs</button>
      </footer>

      <details class="saved" open>
        <summary>Saved for later</summary>
        <div id="savedLaterList" class="savedLaterList"></div>
      </details>

      <details class="audit">
        <summary>Crush history</summary>
        <div id="auditLog" class="auditLog"></div>
      </details>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
